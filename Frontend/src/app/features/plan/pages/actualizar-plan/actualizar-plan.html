<div class="container mt-4" style="max-width: 760px;">
  @if (cargando()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  } @else {
    <h2>Actualizar Plan #{{ planId }}</h2>

    <form (ngSubmit)="guardarCambios()" class="mb-4">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Nombre del Plan</label>
          <input type="text" class="form-control" name="Nombre" [(ngModel)]="plan.Nombre" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Velocidad (Mbps)</label>
          <input type="number" class="form-control" name="Velocidad_Mbps" [(ngModel)]="plan.Velocidad_Mbps" min="1" required>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="planActive" name="Active" [(ngModel)]="plan.Active">
            <label class="form-check-label" for="planActive">Activo</label>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">Guardar Datos del Plan</button>
        <a class="btn btn-secondary" routerLink="/plan">Volver</a>
      </div>
    </form>

    <div class="card">
      <div class="card-header fw-bold">Tarifas del Plan (Plan_Tarifa)</div>
      <div class="card-body">
        @for (t of tarifas(); track t.TarifaId) {
          <div class="row g-2 align-items-center mb-2">
            <div class="col-md-5">
              <select class="form-select" [name]="'mod_' + t.TarifaId" [(ngModel)]="t.Modalidad">
                @for (m of modalidades; track m) {
                  <option [value]="m">{{ m }}</option>
                }
              </select>
            </div>
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" [name]="'prec_' + t.TarifaId" [(ngModel)]="t.Precio" min="0" step="0.01">
              </div>
            </div>
            <div class="col-md-3 d-flex gap-1">
              <button type="button" class="btn btn-success btn-sm" (click)="actualizarTarifaExistente(t)">Guardar</button>
              <button type="button" class="btn btn-outline-danger btn-sm" (click)="eliminarTarifaExistente(t)">Eliminar</button>
            </div>
          </div>
        }

        <hr>
        <h6 class="fw-bold">Agregar Nueva Modalidad</h6>
        <div class="row g-2 align-items-center">
          <div class="col-md-5">
            <select class="form-select" name="nuevaModalidad" [(ngModel)]="nuevaTarifa.Modalidad">
              @for (m of modalidades; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
          </div>
          <div class="col-md-4">
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" name="nuevoPrecio" [(ngModel)]="nuevaTarifa.Precio" min="0" step="0.01">
            </div>
          </div>
          <div class="col-md-3">
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="agregarTarifa()">+ Agregar Tarifa</button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
