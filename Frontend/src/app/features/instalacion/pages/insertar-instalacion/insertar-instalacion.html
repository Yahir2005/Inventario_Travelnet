<div class="container-fluid mt-3">
  <h2>Nueva Instalación</h2>

  <form (ngSubmit)="guardarInstalacion()">

    <!-- Fila 1: Cliente y Tipo -->
    <div class="row mb-3">
      <div class="col-md-6" *ngIf="esClientePreasignado">
        <label class="form-label">Cliente</label>
        <input type="text" class="form-control" value="✓ Cliente asignado automáticamente" disabled>
        <input type="hidden" name="ClienteId" [(ngModel)]="instalacion.ClienteId">
      </div>

      <div class="col-md-6" *ngIf="!esClientePreasignado">
        <label class="form-label">Buscar y Seleccionar Cliente</label>
        
        <!-- Barra de búsqueda dinámica -->
        <input type="search" class="form-control mb-2" placeholder="🔍 Escribe el nombre para buscar..." 
               name="buscadorCliente" [(ngModel)]="terminoBusquedaCliente" (input)="filtrarClientes()">
        
        <!-- Lista de resultados que se filtra en vivo -->
        <select class="form-select" name="ClienteId" [(ngModel)]="instalacion.ClienteId" required>
          <option [ngValue]="null" disabled selected>Selecciona el cliente de la lista...</option>
          <option *ngFor="let cliente of clientesFiltrados" [value]="cliente.ClienteId">
            {{ cliente.Nombre_Cliente }} ({{ cliente.Telefono }})
          </option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Tipo de Conexión</label>
        <select class="form-select" name="Tipo" [(ngModel)]="instalacion.Tipo" required>
          <option value="" disabled selected>Selecciona un tipo...</option>
          <option value="Fibra">Fibra Óptica</option>
          <option value="Antena">Antena (Inalámbrico)</option>
        </select>
      </div>
    </div>

    <!-- Fila 2: Condicional para OLT o Torre -->
    <div class="row mb-3">
      <!-- Se muestra solo si es Fibra -->
      <div class="col-md-6" *ngIf="instalacion.Tipo === 'Fibra'">
        <label class="form-label">Seleccionar OLT</label>
        <select class="form-select" name="OLTId" [(ngModel)]="instalacion.OLTId" required>
          <option value="null" disabled selected>Selecciona una OLT...</option>
          <option *ngFor="let olt of olts" [value]="olt.OLTId">{{ olt.Nombre }}</option>
        </select>
      </div>

      <!-- Se muestra solo si es Antena -->
      <div class="col-md-6" *ngIf="instalacion.Tipo === 'Antena'">
        <label class="form-label">Seleccionar Torre</label>
        <select class="form-select" name="TorreId" [(ngModel)]="instalacion.TorreId" required>
          <option value="null" disabled selected>Selecciona una Torre...</option>
          <option *ngFor="let torre of torres" [value]="torre.TorreId">{{ torre.Nombre }}</option>
        </select>
      </div>
    </div>

    <!-- Fila 3: Datos de Red y Localidad -->
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Nombre de Wi-Fi</label>
        <input type="text" class="form-control" name="Nombre_Wifi" [(ngModel)]="instalacion.Nombre_Wifi" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Contraseña Wi-Fi</label>
        <input type="text" class="form-control" name="Password_Wifi" [(ngModel)]="instalacion.Password_Wifi" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Localidad</label>
        <select class="form-select" name="LocalidadId" [(ngModel)]="instalacion.LocalidadId" required>
          <option value="null" disabled selected>Selecciona una Localidad...</option>
          <option *ngFor="let localidad of localidades" [value]="localidad.LocalidadId">{{ localidad.NombreLocalidad }}</option>
        </select>
      </div>
    </div>

    <!-- Fila 4: Plan y Modalidad de Servicio -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Plan</label>
        <select class="form-select" name="Plan" [(ngModel)]="instalacion.Plan" required>
          <option value="20 MEGAS">20 MEGAS</option>
          <option value="40 MEGAS">40 MEGAS</option>
          <option value="60 MEGAS">60 MEGAS</option>
          <option value="80 MEGAS">80 MEGAS</option>
          <option value="100 MEGAS">100 MEGAS</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Modalidad de Servicio</label>
        <select class="form-select" name="Modalidad_Servicio" [(ngModel)]="instalacion.Modalidad_Servicio" required>
          <option value="Mensual">Mensual</option>
          <option value="Bimestral">Bimestral</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Cuatrimestral">Cuatrimestral</option>
          <option value="Quinquemestral">Quinquemestral</option>
          <option value="Semestral">Semestral</option>
          <option value="Heptamestral">Heptamestral</option>
          <option value="Octomestral">Octomestral</option>
          <option value="Nonamestral">Nonamestral</option>
          <option value="Decamestral">Decamestral</option>
          <option value="Oncemestral">Oncemestral</option>
          <option value="Anual">Anual</option>
        </select>
      </div>
    </div>

    <!-- Fila 5: Geolocalización -->
    <div class="mb-4 p-3 border rounded bg-body-tertiary">
      <label class="form-label d-block fw-bold">Ubicación del Dispositivo (Google Maps)</label>
      
      <div class="input-group mb-2">
        <span class="input-group-text">📍</span>
        <input type="url" class="form-control" name="Ubicacion_Maps" 
               [(ngModel)]="instalacion.Ubicacion_Maps" 
               placeholder="Pega el enlace de Google Maps aquí..." required>
        
        <button type="button" class="btn btn-info text-white" 
                (click)="obtenerUbicacion()" [disabled]="cargandoUbicacion">
          {{ cargandoUbicacion ? 'Obteniendo...' : 'Capturar GPS' }}
        </button>
      </div>
      
      <div class="form-text text-muted mb-2">
        Puedes presionar "Capturar GPS" para obtener tu ubicación actual o pegar manualmente un enlace.
      </div>
      
      @if (instalacion.Ubicacion_Maps) {
        <div class="alert alert-success mt-2 p-2">
          Ubicación lista para guardar: <br>
          <a [href]="instalacion.Ubicacion_Maps" target="_blank" class="small text-break">
            {{ instalacion.Ubicacion_Maps }}
          </a>
        </div>
      }
    </div>

    <!-- Botones Finales -->
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Registrar Instalación</button>
    </div>

  </form>
</div>
