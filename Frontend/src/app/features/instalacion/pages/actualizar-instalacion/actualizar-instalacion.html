<div class="container-fluid mt-3">

    <h2>Actualizar Instalación <span class="text-dark">#{{ instalacionId }}</span></h2>

    <form (ngSubmit)="guardarCambios()" #formActualizar="ngForm">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Cliente</label>
          <input type="text" class="form-control" [value]="obtenerNombreCliente(instalacion.ClienteId)" disabled>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tipo de Conexión</label>
          <select class="form-select" name="Tipo" [(ngModel)]="instalacion.Tipo" required>
            <option value="" disabled>Selecciona un tipo...</option>
            <option value="Fibra">Fibra Óptica</option>
            <option value="Antena">Antena (Inalámbrico)</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        @if (instalacion.Tipo === 'Fibra') {
          <div class="col-md-6">
            <label class="form-label">Seleccionar OLT</label>
            <select class="form-select" name="OLTId" [(ngModel)]="instalacion.OLTId" required>
              <option [ngValue]="null" disabled>Selecciona una OLT...</option>
              @for (olt of olts; track olt.OLTId) {
                <option [ngValue]="olt.OLTId">{{ olt.Nombre }}</option>
              }
            </select>
          </div>
        }

        @if (instalacion.Tipo === 'Antena') {
          <div class="col-md-6">
            <label class="form-label">Seleccionar Torre</label>
            <select class="form-select" name="TorreId" [(ngModel)]="instalacion.TorreId" required>
              <option [ngValue]="null" disabled>Selecciona una Torre...</option>
              @for (torre of torres; track torre.TorreId) {
                <option [ngValue]="torre.TorreId">{{ torre.Nombre }}</option>
              }
            </select>
          </div>
        }
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Nombre de Wi-Fi</label>
          <input type="text" class="form-control" name="Nombre_Wifi" [(ngModel)]="instalacion.Nombre_Wifi" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Contraseña Wi-Fi</label>
          <input type="text" class="form-control" name="Password_Wifi" [(ngModel)]="instalacion.Password_Wifi" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Localidad</label>
          <select class="form-select" name="LocalidadId" [(ngModel)]="instalacion.LocalidadId" required>
            <option [ngValue]="null" disabled>Selecciona una Localidad...</option>
            @for (localidad of localidades; track localidad.LocalidadId) {
              <option [ngValue]="localidad.LocalidadId">{{ localidad.NombreLocalidad }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Plan</label>
          <select class="form-select" name="Plan" [(ngModel)]="instalacion.Plan" required>
            <option value="20 MEGAS">20 MEGAS</option>
            <option value="40 MEGAS">40 MEGAS</option>
            <option value="60 MEGAS">60 MEGAS</option>
            <option value="80 MEGAS">80 MEGAS</option>
            <option value="100 MEGAS">100 MEGAS</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Modalidad de Servicio</label>
          <select class="form-select" name="Modalidad_Servicio" [(ngModel)]="instalacion.Modalidad_Servicio" required>
            <option value="Mensual">Mensual</option>
            <option value="Bimestral">Bimestral</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Cuatrimestral">Cuatrimestral</option>
            <option value="Quinquemestral">Quinquemestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Heptamestral">Heptamestral</option>
            <option value="Octomestral">Octomestral</option>
            <option value="Nonamestral">Nonamestral</option>
            <option value="Decamestral">Decamestral</option>
            <option value="Oncemestral">Oncemestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>
      </div>

      <div class="mb-4 p-3 border rounded bg-light">
        <label class="form-label d-block fw-bold">Ubicación del Dispositivo</label>

        <button type="button" class="btn btn-info mb-2" (click)="obtenerUbicacion()" [disabled]="cargandoUbicacion">
          {{ cargandoUbicacion ? 'Obteniendo coordenadas...' : '📍 Recapturar mi ubicación actual' }}
        </button>

        @if (instalacion.Ubicacion_Maps) {
          <div class="alert alert-success mt-2 p-2">
            Ubicación registrada: <br>
            <a [href]="instalacion.Ubicacion_Maps" target="_blank" class="small text-break">{{ instalacion.Ubicacion_Maps }}</a>
          </div>
        }
      </div>

      <div class="mt-4 d-flex gap-2 mb-5">
        <button type="button" class="btn btn-secondary" routerLink="/instalacion">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="formActualizar.invalid">
          Guardar Cambios
        </button>
      </div>

    </form>
  
</div>
