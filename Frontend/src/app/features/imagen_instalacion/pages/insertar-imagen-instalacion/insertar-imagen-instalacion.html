<div class="container-fluid mt-3">
  <h2>Evidencia de Instalación</h2>

  <div class="mb-4" *ngIf="!fotoCapturada">
    <video #videoElement autoplay playsinline style="width: 100%; max-width: 600px; border: 2px solid #ccc; border-radius: 8px;"></video>
    
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-secondary" (click)="iniciarCamara()" *ngIf="!mediaStream">
        📷 Activar Cámara
      </button>

      <!-- Botón para subir archivo manual -->
      <button type="button" class="btn btn-outline-secondary" (click)="fileInput.click()" *ngIf="!mediaStream">
        📁 Subir Imagen
      </button>
      <input type="file" #fileInput accept="image/*" style="display: none;" (change)="cargarImagenManual($event)">

      <button type="button" class="btn btn-primary" (click)="capturarFoto()" *ngIf="mediaStream" [disabled]="!coordenadasObtenidas">
        {{ coordenadasObtenidas ? '📸 Tomar Fotografía' : '⏳ Obteniendo ubicación...' }}
      </button>
    </div>
  </div>

  <canvas #canvasElement style="display: none;"></canvas>

  <!-- Sección: Vista previa de la foto tomada -->
  <div class="mb-4" *ngIf="fotoCapturada">
    <h5 class="text-success">¡Foto capturada con éxito!</h5>
    <img [src]="fotoCapturada" style="width: 100%; max-width: 600px; border: 2px solid #28a745; border-radius: 8px;">
    
    <div class="mt-3">
      <button type="button" class="btn btn-warning" (click)="fotoCapturada = null; iniciarCamara()">
        🔄 Repetir Foto
      </button>
    </div>
  </div>

  <!-- Botón final para guardar en MariaDB -->
  <hr>
  <button type="button" class="btn btn-success btn-lg" (click)="saveImagen_Instalacion()" [disabled]="!fotoCapturada">
    💾 Guardar en Base de Datos
  </button>
</div>
